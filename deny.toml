# cargo-deny's baseline (issue #14): mirror audit.toml's philosophy.
# ONLY new advisories may fail CI; the informational unmaintained set
# is ignored BY ID (the annotated list lives in audit.toml — prune both
# files as upstreams resolve). Licenses are the allow-list of normal
# permissive OSS; duplicate major versions warn without failing, so the
# drift stays visible without gating the lock.

[advisories]
version = 2
ignore = [
    "RUSTSEC-2024-0436", # paste (transitive of wry/tao, x11)
    "RUSTSEC-2026-0206", # rustybuzz (gpui's text shaping)
    "RUSTSEC-2026-0192", # ttf-parser (rustybuzz's dependency)
    "RUSTSEC-2026-0371", # zbus_names (zbus, the Linux portal client)
    "RUSTSEC-2026-0370", # zvariant (zbus, the Linux portal client)
    "RUSTSEC-2026-0372", # zvariant_derive (zbus, the Linux portal client)
]

[licenses]
version = 2
allow = [
    "MIT",
    "NCSA", # libfuzzer-sys's bundled libFuzzer C++
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "BSL-1.0",
    "CC0-1.0",
    "0BSD",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
    "MPL-2.0",
]

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
