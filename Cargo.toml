[workspace]
resolver = "2"
members = ["crates/core", "crates/app-gpui"]

# Vendored patches (the D13/D29 mechanism: vendor/ + [patch.crates-io]).
# The retired ones (xattr D13, cosmic-text D29, proc-macro-error2) live in
# git history only; re-vendor from there if their chains return.
#
# D66 (Nov 2026): gpui-pre-wgpu, one guard. load_family's 'm' gate bars
# every color emoji font from loading as a PRIMARY family (their cmaps
# carry no Latin), so emoji requested by name silently fell back to the UI
# face and painted monochrome through DejaVu/Adwaita outlines. The gate
# now exempts known emoji fonts. Re-ported onto 0.3.14 (D107; the gate is
# unchanged upstream, so the clause is still needed).
[patch.crates-io]
gpui-pre-wgpu = { path = "vendor/gpui-pre-wgpu" }
# D118 (Nov 2026): nostr-lmdb 0.45.3 opens the env with OS readahead
# on, and its builder can't change that. Every random page fault in the
# 1.5 GB store pulled a large read: the cold first feed page took
# 1.5-3.9 s, 0.18 s with NO_READ_AHEAD (one flag in
# src/store/lmdb/mod.rs from_builder). D121 adds the background copy's
# hooks: Lmdb::last_txn_id / copy_compact_to (heed's compacting copy) and
# NostrLmdb's write log (start_journal/stop_journal; save_event, delete
# and wipe append a line while it runs). Re-port when bumping nostr-lmdb.
nostr-lmdb = { path = "vendor/nostr-lmdb" }
# D72 (Nov 2026): gpui-video-player 0.1.3 rejects caps framerate 0/1 —
# exactly what GIF-to-MP4 converters emit (nostr.build, 21media) — so
# every gif-as-mp4 tap died at Video::new and degraded to the browser
# ("pipeline failed ... Framerate(0.0)"). The value only feeds the
# framerate() getter (frames are appsink-pulled, not paced off it), so
# the vendored copy keeps the file and drops the zero-fps arm. Upstream
# 0.1.3 is newest as of Nov 2026; retire the patch if a release fixes it.
gpui-video-player = { path = "vendor/gpui-video-player" }

[workspace.package]
version = "0.13.0"
edition = "2024"
license = "MIT"
authors = ["Letdown2491"]

# D35/P5: the renderer migration. gpui 0.2.2's blade backend has an
# unpublished fatal atlas race (create-then-evict within a frame panics
# flush_initializations); Zed's own remedy was the wgpu renderer, which
# ships in the gpui-pre crates.io snapshots (=0.3.14 is zed@<Nov 2026>).
# The dep key stays `gpui` (package rename) so `use gpui::` imports
# survive. Pinned =0.3.14 (D107) to unify with gpui-video-player's
# `gpui-pre` feature: its VideoElement implements THAT snapshot's
# traits, and two snapshot versions would be two incompatible gpui
# copies (the vendored copy's pin moves with this one). The vendored
# patches are retired: the official-gpui graph (xattr/async-tar chain)
# drops out entirely; cosmic-text re-check pending for D29.
[workspace.dependencies]
gpui = { package = "gpui-pre", version = "=0.3.14" }
gpui-pre-linux = "=0.3.14"
nostr = "0.45"
nostr-sdk = "0.45"
nostr-connect = "0.45"
nostr-lmdb = "0.45"
nostr-database = "0.45"
nwc = "0.45"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net"] }
tokio-socks = "0.5"
# Rust-side global allocator (app-gpui): glibc's per-thread arenas retained
# ~2GB of freed churn in a long session (37 arenas x ~50MB; audit Nov 2026).
mimalloc = "0.1"
futures-util = "0.3"
# Locks without poisoning (review Nov 27 2026): one panicking task used to
# poison a Core mutex and turn every later UI read into a second panic.
parking_lot = "0.12"
qrcode = { version = "0.14", default-features = false }
keyring = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
# avif: an increasingly common picture format on the relays — without the
# decoder its bytes fail validation and the picture is written off as
# not-media forever (polish pass: permanent-failure media bugs).
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif", "avif"] }
sha2 = "0.10"
url = "2"
base64 = "0.22"
bech32 = "0.12"
chrono = "0.4"
# Content filters (D110): linear-time user regex rules, and the script
# classifier behind the lookalike-character spam signal.
regex = "1"
libc = "0.2"
unicode-script = "0.5"

# Daily-driver release: stripped (the 25GB debug tree is dev-only), thin
# LTO and a single codegen unit for the render hot paths (D25).
[profile.release]
lto = "thin"
strip = "symbols"
codegen-units = 1
