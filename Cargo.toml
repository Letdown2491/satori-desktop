[workspace]
resolver = "2"
members = ["crates/core", "crates/app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["Letdown2491"]

[workspace.dependencies]
nostr = "0.45"
nostr-sdk = "0.45"
nostr-connect = "0.45"
nostr-lmdb = "0.45"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net"] }
tokio-socks = "0.5"
keyring = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = "thin"
strip = "symbols"
