# PR CI (issue #14): every pull request (and push to main) passes the
# same gates the maintainer's manual container run did — fmt, clippy
# with warnings denied, the test suite, the advisory scan, and a lint
# of these workflow files themselves. --locked everywhere: the lock
# changes only via explicit review (Renovate PRs are that review).
#
# No container images enter this workflow (the toolchains install from
# the distro and crates.io). Every action is pinned by digest, matching
# release.yml's contract; Renovate (issue #14's automation half) keeps
# the pins moving via reviewed PRs.
#
# audit.toml carries the advisory baseline: the six informational
# unmaintained warnings are ignored BY ID, everything else fails.
# deny.toml mirrors that philosophy (advisories by ID, a permissive
# license allow-list, duplicate-major-versions as warnings).

name: pr

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install the Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch head
        with:
          components: rustfmt, clippy

      - name: Install the client libraries satori links
        # Same list as release.yml — the crate graph cannot even resolve
        # (pkg-config/fontconfig) without them.
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libfontconfig-dev \
            libfreetype-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libwayland-dev \
            libxcb1-dev \
            libvulkan-dev \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev

      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Formatting
        run: cargo fmt --check

      - name: Clippy (warnings denied)
        run: cargo clippy --workspace --locked -- -D warnings

      - name: Tests
        run: cargo test --locked --workspace

      - name: Install cargo-audit and cargo-deny
        uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2 branch head
        with:
          tool: cargo-audit,cargo-deny

      # install-action dropped actionlint support (its fallback, cargo
      # binstall, looks for a crate that does not exist); the tool's own
      # download script, pinned at the tool's tag, is the documented route.
      - name: Install actionlint
        run: |
          curl -fsSf https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash \
            | bash -s -- 1.7.12
          ./actionlint --version | head -1

      - name: Lint the workflows
        run: ./actionlint

      - name: Advisories (audit.toml is the baseline)
        run: cargo audit

      - name: Supply chain (deny.toml is the baseline)
        run: cargo deny check
