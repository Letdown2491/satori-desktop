[package]
name = "satori"
description = "Satori — a quiet Nostr client. Native Linux GTK4/libadwaita app."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "satori"
path = "src/main.rs"

[dependencies]
satori-core = { path = "../core" }
gtk = { package = "gtk4", version = "0.11", features = ["v4_12"] }
adw = { package = "libadwaita", version = "0.9", features = ["v1_5"] }
nostr = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = "0.4"
url = { workspace = true }
