<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!--
    Placeholder ensō: open brush circle. The real one is the procedural
    brushstroke generator from src/render/svg.ts (sine-modulated width +
    turbulence brush filter) — port as an asset generator (DESIGN.md §5.4).
  -->
  <defs>
    <filter id="brush" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.55" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="7"/>
    </filter>
  </defs>
  <path d="M 142 38 A 76 76 0 1 0 172 104"
        fill="none" stroke="#191714" stroke-width="11"
        stroke-linecap="round" filter="url(#brush)"/>
</svg>
