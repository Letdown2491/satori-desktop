[package]
name = "satori-core"
description = "Satori's Nostr domain layer: relay routing, signing, storage, NIPs. No UI dependencies."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
parking_lot = { workspace = true }
nostr = { workspace = true }
nostr-sdk = { workspace = true }
nostr-connect = { workspace = true }
nostr-lmdb = { workspace = true }
nostr-database = { workspace = true }
nwc = { workspace = true }
tokio = { workspace = true }
rand = "0.8"
tokio-socks = { workspace = true }
futures-util = { workspace = true }
keyring = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
reqwest = { workspace = true }
image = { workspace = true }
sha2 = { workspace = true }
url = { workspace = true }
base64 = { workspace = true }
bech32 = { workspace = true }
# Secret round-trips wipe on drop (#31 hardening): the nsec/bunker/NWC
# Strings that ride through load() don't linger in freed heap.
zeroize = "1"

[dev-dependencies]
# The NIP-45 fixture probe only: raw COUNT frames to a live relay (the SDK's
# count_events returns a bare usize; fixtures need the wire JSON).
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-webpki-roots"] }
