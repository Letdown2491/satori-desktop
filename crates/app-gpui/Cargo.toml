[package]
name = "satori-gpui"
description = "Satori's GPUI front-end: views re-expressed from crates/app on Zed's GPUI (D13). Domain logic lives in crates/core."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "satori-desktop"
path = "src/main.rs"

[dependencies]
gpui = { workspace = true }
nostr = { workspace = true }
satori-core = { path = "../core" }
image = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
unicode-segmentation = "1"
# QR codes for the nostrconnect login door (rendered to PNG, handed to gpui).
qrcode = { workspace = true }
# File picker for the composer's attachments (xdg-desktop-portal backend).
rfd = "0.15"
