[package]
name = "satori-gpui"
description = "Satori's GPUI front-end: views re-expressed from crates/app on Zed's GPUI (D13). Domain logic lives in crates/core."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "satori-desktop"
path = "src/main.rs"

[dependencies]
gpui = { workspace = true }
nostr = { workspace = true }
satori-core = { path = "../core" }
image = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
unicode-segmentation = "1"
# QR codes for the nostrconnect login door (rendered to PNG, handed to gpui).
qrcode = { workspace = true }
# File picker for the composer's attachments (xdg-desktop-portal backend).
rfd = "0.15"
# The appearance portal (color-scheme, prefers-reduced-motion) — one
# ReadOne pair at startup, blocking (desktop.rs).
zbus = { version = "5", default-features = false, features = ["blocking", "tokio"] }
# malloc_trim: glibc arenas retain freed heap (35 threads of arenas); the
# trim timer hands it back to the OS on a slow clock (main.rs).
libc = "0.2"
tokio = { workspace = true }
